name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: sky2712/technova-api

jobs:
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Ejecutar pytest
        run: pytest -v

  security:
    name: Seguridad (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar bandit
        run: pip install bandit
      - name: Escanear con bandit
        run: bandit -r app.py test_app.py -s B101 -f txt

  trivy:
    name: Escaneo (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Escanear repositorio con Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'table'

  build-and-push:
    name: Build y push Docker Hub
    needs: [test, security, trivy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Desplegar en EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Preparar clave SSH desde base64
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" | base64 --decode > "$RUNNER_TEMP/ec2_key.pem"
          chmod 600 "$RUNNER_TEMP/ec2_key.pem"
      - name: Conectar por SSH y desplegar
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key_path: ${{ runner.temp }}/ec2_key.pem
          script: |
            docker pull ${{ env.IMAGE_NAME }}:latest
            cd /opt/technova
            docker compose up -d